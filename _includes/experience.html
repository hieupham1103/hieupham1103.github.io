<section class="experience-section">
    <div class="experience-content">
        <h2 class="section-title">{{ site.data.home.experience.title }}</h2>
        <div class="timeline">
            {% for role in site.data.home.experience.items %}
            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <a href="{{ role.url }}" target="_blank" rel="noopener" class="timeline-logo"><img src="{{ role.logo | relative_url }}" alt="{{ role.logo_alt }}"></a>
                    <div class="timeline-info">
                        <div class="timeline-date">{{ role.date }}</div>
                        <h3 class="timeline-title">{{ role.title }}</h3>
                        <p class="timeline-company">{{ role.company }}</p>
                        {% if role.description %}<p class="timeline-description">{{ role.description }}</p>{% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
