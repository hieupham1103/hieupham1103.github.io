{% assign contact = site.data.home.contacts %}
<section id="contact" class="contact-section">
    <div class="contact-content">
        <h2 class="contact-title">{{ contact.title }}</h2>
        <p class="contact-subtitle">{{ contact.subtitle }}</p>
        <div class="contact-list">
            {% for email in contact.emails %}
            <div class="contact-item" onclick="copyToClipboard('{{ email.address }}', this)">
                <div class="contact-text"><span class="contact-label">{{ email.label }}</span><span class="contact-email">{{ email.address }}</span></div>
                <span class="copy-icon" aria-hidden="true">⧉</span>
            </div>
            {% endfor %}
        </div>
        <div class="contact-divider"></div>
        <div class="contact-social">
            {% for social in contact.socials %}<a href="{{ social.url }}" target="_blank" rel="noopener" class="social-link">{{ social.label }}</a>{% endfor %}
        </div>
    </div>
</section>
