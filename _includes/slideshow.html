<section class="slideshow-section">
    <div class="slideshow-header">
        <h2>Latest Posts & Videos</h2>
        <p>Exploring AI, mathematics, and computer science through educational content</p>
    </div>
    
    <div class="slideshow-container">
        <div class="slideshow-wrapper">
            <div class="slideshow-track" id="slideshow-track">
                {% assign all_content = site.posts | concat: site.videos | sort: 'date' | reverse %}
                {% for item in all_content limit:12 %}
                <div class="slide-item">
                    {% include content-card.html item=item %}
                </div>
                {% endfor %}
            </div>
        </div>
        
        <div class="slideshow-controls">
            <button class="slideshow-btn" id="prev-btn" onclick="moveSlide(-1)">‹</button>
            <div class="slideshow-dots" id="dots-container"></div>
            <button class="slideshow-btn" id="next-btn" onclick="moveSlide(1)">›</button>
        </div>
    </div>
</section>
