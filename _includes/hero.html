{% assign hero = site.data.home.hero %}
<div class="hero-section">
    <div class="hero-content">
        <div class="hero-profile"><img src="{{ hero.avatar | relative_url }}" alt="{{ hero.name }}" class="profile-image"></div>
        <div class="hero-text">
            <p class="hero-eyebrow">{{ hero.eyebrow }}</p>
            <h1 class="hero-title">{{ hero.name }}</h1>
            <p class="hero-subtitle">{{ hero.subtitle }}</p>
            <div class="hero-links">
                {% for social in site.data.home.contacts.socials %}
                <a href="{{ social.url }}" target="_blank" rel="noopener" class="hero-link">{{ social.label }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
