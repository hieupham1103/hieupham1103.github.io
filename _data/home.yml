about:
  title: About Me
  paragraphs:
    - "I'm a third-year **Computer Science student** and **AI Research Assistant** at *Vietnamese-German University – VGU*. My current research focuses on few-shot learning, vision-language models, and real-time computer vision systems, aiming to develop more efficient and adaptive AI architectures."
    - "My academic foundation is rooted in competitive programming, having earned a **Third Prize in the Vietnamese Olympiad in Informatics – VOI** during my time at *Le Quy Don High School for the Gifted – Khanh Hoa*. This experience instilled in me a deep love for algorithmic problem-solving and technical excellence."
    - "In addition to my research, I lead Orzlab as a Content Creator. I am passionate about AI education and dedicated to making advanced concepts in mathematics and computer science accessible to everyone."
